name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - v0.1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Validate repository scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate structure and metadata
        run: npm run check

      - name: Confirm acceptance diagnostics are safe to upload
        id: acceptance_diagnostics
        if: always()
        run: npm run verify:acceptance-diagnostics

      - name: Upload acceptance diagnostics
        if: always() && steps.acceptance_diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-diagnostics-node-22
          path: .runtime-evidence/acceptance/diagnostics.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  current-node:
    name: Validate current Node.js
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate structure and metadata
        run: npm run check

      - name: Confirm acceptance diagnostics are safe to upload
        id: acceptance_diagnostics
        if: always()
        run: npm run verify:acceptance-diagnostics

      - name: Upload acceptance diagnostics
        if: always() && steps.acceptance_diagnostics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-diagnostics-node-current
          path: .runtime-evidence/acceptance/diagnostics.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
